name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# v0.3.2 (Section 3): GitHub Actions runners currently execute JS actions
# under Node.js 20, which reaches end-of-life in 2026-06 and is forcibly
# upgraded to Node 24 in mid-2026. Opting in early here avoids a silent
# breakage window and gives us time to bump action major versions when
# their v5 / v6 releases ship.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  backend:
    name: Backend (pytest)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ui-implementation/src-tauri/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: ui-implementation/src-tauri/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        env:
          ROAMPAL_ENV: test
          ROAMPAL_DATA_DIR: ${{ runner.temp }}/roampal-test-data
        run: |
          python -m pytest tests/ -v --tb=short

  frontend:
    name: Frontend (vitest + tsc + eslint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui-implementation

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ui-implementation/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: node node_modules/typescript/bin/tsc --noEmit

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
